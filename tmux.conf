# ==========================================
# Tmux Configuration with Theme & Neovim Integration
# ==========================================

# Set prefix to Ctrl+a (easier than Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Faster command sequences
set -sg escape-time 0

# Increase history limit
set -g history-limit 50000

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ==========================================
# Theme: Modern Dark with Rounded Corners
# ==========================================

# Status bar colors
set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left-length 100
set -g status-right-length 100

# Rounded separators
set -g status-left "#[fg=#bd93f9,bg=#282a36] #[fg=#282a36,bg=#bd93f9,bold] #S #[fg=#bd93f9,bg=#282a36] "

# Status bar right (rounded segments)
set -g status-right "#[fg=#50fa7b,bg=#282a36] #[fg=#282a36,bg=#50fa7b,bold] %H:%M #[fg=#50fa7b,bg=#282a36] #[fg=#ff79c6,bg=#282a36] #[fg=#282a36,bg=#ff79c6,bold] %d-%b-%y #[fg=#ff79c6,bg=#282a36] "

# Window status (rounded)
setw -g window-status-format "#[fg=#6272a4,bg=#282a36] #I:#W "
setw -g window-status-current-format "#[fg=#ff79c6,bg=#282a36] #[fg=#282a36,bg=#ff79c6,bold] #I:#W #[fg=#ff79c6,bg=#282a36]"

# Pane borders
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"

# Message style
set -g message-style "bg=#44475a,fg=#f8f8f2"

# ==========================================
# Key Bindings (Neovim-friendly)
# ==========================================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Split panes with intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vi mode for copy mode
setw -g mode-keys vi

# Copy mode bindings (vi-style)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (vim-style)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r p previous-window
bind -r n next-window

# Swap windows
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# ==========================================
# Neovim Integration
# ==========================================

# Set environment for neovim
set -g update-environment "TERM TERM_PROGRAM"

# Better escape handling for neovim
set -sg escape-time 10

# Clipboard integration (works with neovim)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# ==========================================
# Status Bar Info
# ==========================================

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

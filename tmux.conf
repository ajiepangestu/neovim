# ==========================================
# Tmux Configuration with Theme & Neovim Integration
# ==========================================

# Set prefix to Ctrl+b (default, avoids conflict with Neovim Ctrl+a increment)
unbind C-a
set -g prefix C-b
bind C-b send-prefix

# Enable mouse support
set -g mouse on

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Faster command sequences
set -sg escape-time 0

# Increase history limit
set -g history-limit 50000

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ==========================================
# Theme: Monokai Pro (aligned with Neovim)
# ==========================================

# Status bar colors
set -g status-style "bg=#2d2a2e,fg=#fcfcfa"
set -g status-left-length 200
set -g status-right-length 200
set -g status-interval 5

# Rounded separators
set -g status-left "#[fg=#ab9df2,bg=#2d2a2e] #[fg=#2d2a2e,bg=#ab9df2,bold]  #S #[fg=#ab9df2,bg=#2d2a2e] "

# Status bar right (rounded segments)
set -g status-right "#[fg=#78dce8,bg=#2d2a2e] #[fg=#2d2a2e,bg=#78dce8,bold]  #H #[fg=#78dce8,bg=#2d2a2e] #[fg=#ff6188,bg=#2d2a2e] #[fg=#2d2a2e,bg=#ff6188,bold]  #(top -bn1 | grep 'Cpu(s)' | awk '{printf \"%.0f%%\",$2+$4}') #[fg=#ff6188,bg=#2d2a2e] #[fg=#ffd866,bg=#2d2a2e] #[fg=#2d2a2e,bg=#ffd866,bold]  #(free -m | awk 'NR==2{printf \"%.1fG\",$3/1024}') #[fg=#ffd866,bg=#2d2a2e]#(if [ -f /sys/class/power_supply/BAT1/capacity ]; then printf ' #[fg=#a9dc76,bg=#2d2a2e] #[fg=#2d2a2e,bg=#a9dc76,bold]  %s%%%% #[fg=#a9dc76,bg=#2d2a2e]' \"$(cat /sys/class/power_supply/BAT1/capacity)\"; fi) #[fg=#fc9867,bg=#2d2a2e] #[fg=#2d2a2e,bg=#fc9867,bold]  %d-%b #[fg=#fc9867,bg=#2d2a2e] "

# Window status (rounded)
setw -g window-status-format "#[fg=#727072,bg=#2d2a2e] #I:#W "
setw -g window-status-current-format "#[fg=#ff6188,bg=#2d2a2e] #[fg=#2d2a2e,bg=#ff6188,bold] #I:#W #[fg=#ff6188,bg=#2d2a2e]"

# Pane borders
set -g pane-border-style "fg=#403e41"
set -g pane-active-border-style "fg=#ab9df2"

# Message style
set -g message-style "bg=#403e41,fg=#fcfcfa"

# ==========================================
# Key Bindings (Neovim-friendly)
# ==========================================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Split panes with intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vi mode for copy mode
setw -g mode-keys vi

# Copy mode bindings (vi-style)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (vim-style, step 5)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane resizing (arrow keys, step 2)
bind -r Left resize-pane -L 2
bind -r Down resize-pane -D 2
bind -r Up resize-pane -U 2
bind -r Right resize-pane -R 2

# Pane resizing (shift+arrow, step 10)
bind -r S-Left resize-pane -L 10
bind -r S-Down resize-pane -D 10
bind -r S-Up resize-pane -U 10
bind -r S-Right resize-pane -R 10

# Equalize panes
bind = select-layout -t . even-horizontal
bind + select-layout -t . even-vertical

# Window navigation
bind -r p previous-window
bind -r n next-window

# Swap windows
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# ==========================================
# Neovim Integration
# ==========================================

# Set environment for neovim
set -g update-environment "TERM TERM_PROGRAM"

# Better escape handling for neovim
set -sg escape-time 10

# Clipboard integration (works with neovim)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# ==========================================
# Status Bar Info
# ==========================================

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on
